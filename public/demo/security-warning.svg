<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Simulated permission prompt for an app from an unknown publisher"><rect width="1200" height="720" fill="#4a4f55"/><rect x="300" y="90" width="600" height="540" fill="#ffffff"/><rect x="300" y="90" width="600" height="190" fill="#f6e7c1"/><text x="330" y="130" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222" xml:space="preserve">User Account Control</text><text x="330" y="180" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#111" xml:space="preserve">Do you want to allow this app from an</text><text x="330" y="212" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#111" xml:space="preserve">unknown publisher to make changes to</text><text x="330" y="244" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#111" xml:space="preserve">your device?</text><text x="330" y="326" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#222" xml:space="preserve">Program name: QuickPDF_Converter_Setup.exe</text><text x="330" y="366" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#222" xml:space="preserve">Publisher: Unknown</text><text x="330" y="406" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#222" xml:space="preserve">File origin: Downloaded from the Internet</text><text x="330" y="456" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#0a5aa6" xml:space="preserve">Show more details</text><rect x="330" y="540" width="260" height="46" fill="#e1e1e1" stroke="#adadad"/><text x="460" y="570" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#111" xml:space="preserve">Yes</text><rect x="610" y="540" width="260" height="46" fill="#e1e1e1" stroke="#adadad"/><text x="740" y="570" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#111" xml:space="preserve">No</text></svg>
